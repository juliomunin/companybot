<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Erro ' + (${status} ?: 500) + ' | CompanyBot'">Erro | CompanyBot</title>
    <link rel="icon" th:href="@{/rs/images/favicon.ico}" type="image/x-icon">
    <link rel="stylesheet" th:href="@{/rs/css/style.css}">
    <link rel="stylesheet" th:href="@{/rs/css/app.css}">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: #f5f7fa;
            text-align: center;
        }
        .error-code {
            font-size: 96px;
            line-height: 1;
            font-weight: 700;
            color: #62bfe6;
            margin-bottom: 10px;
        }
        .error-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-top: 24px;
        }
    </style>
</head>
<body>
    <main class="error-page">
        <div>
            <div class="error-code" th:text="${status ?: 500}">500</div>
            <h1 class="heading-3" th:text="${titulo ?: (status == 404 ? 'Página não encontrada' : 'Algo deu errado')}">Algo deu errado</h1>
            <p th:text="${mensagem ?: (status == 404 ? 'O endereço que você tentou acessar não existe.' : 'Não foi possível concluir a operação. Tente novamente em instantes.')}">
                Não foi possível concluir a operação.
            </p>
            <p class="text-muted" th:if="${caminho != null}">
                <small th:text="${caminho}">/caminho</small>
            </p>
            <div class="error-actions">
                <a class="button button-primary" th:href="@{/}">Voltar ao início</a>
                <a class="button button-default" th:href="@{/contato}">Falar com a equipe</a>
            </div>
        </div>
    </main>
</body>
</html>
