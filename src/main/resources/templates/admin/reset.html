<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/argon :: head}"></head>
<body class="bg-default">
    <div class="header bg-gradient-primary py-7 py-lg-8">
        <div class="container">
            <div class="header-body text-center mb-7">
                <div class="row justify-content-center">
                    <div class="col-lg-5 col-md-6">
                        <h1 class="text-white">Redefinir Senha</h1>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container mt--8 pb-5">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7">
                <div class="card bg-secondary shadow border-0">
                    <div class="card-body px-lg-5 py-lg-5">
                        <div class="text-center text-muted mb-4">
                            <small>Escolha uma nova senha para a sua conta</small>
                        </div>

                        <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${error != null}">
                            <span th:text="${error}">Link inválido ou expirado.</span>
                            <button type="button" class="close" data-dismiss="alert" aria-label="Fechar">
                                <span aria-hidden="true">&times;</span>
                            </button>
                        </div>

                        <form role="form" th:action="@{/reset}" method="post">
                            <input type="hidden" name="token" th:value="${token}">
                            <div class="form-group mb-3">
                                <div class="input-group input-group-alternative">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text"><i class="ni ni-lock-circle-open"></i></span>
                                    </div>
                                    <input class="form-control" placeholder="Nova senha (6 a 20 caracteres)" type="password"
                                           name="despassword" minlength="6" maxlength="20"
                                           autocomplete="new-password" autofocus required>
                                </div>
                            </div>
                            <div class="form-group">
                                <div class="input-group input-group-alternative">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text"><i class="ni ni-lock-circle-open"></i></span>
                                    </div>
                                    <input class="form-control" placeholder="Confirme a nova senha" type="password"
                                           name="despassword2" minlength="6" maxlength="20"
                                           autocomplete="new-password" required>
                                </div>
                            </div>
                            <div class="text-center">
                                <button type="submit" class="btn btn-primary my-4">Salvar nova senha</button>
                            </div>
                        </form>
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-12 text-center">
                        <a th:href="@{/login}" class="text-light"><small>Voltar para o login</small></a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/argon :: scripts}"></div>
</body>
</html>
