<!DOCTYPE html>
<html lang="pt-BR" data-x-mode="true" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/intense :: head}"></head>
<body>
    <div class="page">
        <header th:replace="~{fragments/intense :: navbar}"></header>

        <!--Google Map-->
        <section class="section">
            <style>
                #mapa { height:500px; width:100%; }
            </style>
            <div id="mapa"></div>
            <script>
                function inicializar() {
                    var coordenadas = {lat: -23.571449, lng: -46.586318};
                    var mapa = new google.maps.Map(document.getElementById('mapa'), { zoom: 15, center: coordenadas });
                    var marker = new google.maps.Marker({
                        position: coordenadas,
                        map: mapa,
                        title: 'Data Cleansing Service - CompanyBot - Rua São Nocásio, 211 São Paulo - SP'
                    });
                }
            </script>
            <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBhDpRPHWAGEYo5tlIqBaem5mGfjf8orAY&callback=inicializar"></script>
        </section>

        <!--Contacts-->
        <section class="section section-lg bg-gray-700">
            <div class="container">
                <div class="row row-30">
                    <div class="col-lg-4">
                        <div class="row row-30">
                            <div class="col-sm-6 col-lg-12 wow fadeInRight" data-wow-delay=".05s">
                                <article class="info-classic align-items-center">
                                    <div class="unit unit-spacing-md align-items-center flex-column flex-md-row text-center text-md-left">
                                        <div class="unit-left"><div class="info-classic-icon fa-envelope"></div></div>
                                        <div class="unit-body"><a class="info-classic-link" href="mailto:melianatosi@companybot.com.br">melianatosi@companybot.com.br</a></div>
                                    </div>
                                </article>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-4">
                        <div class="row row-30">
                            <div class="col-sm-6 col-lg-12 wow fadeInRight" data-wow-delay=".1s">
                                <article class="info-classic align-items-center info-classic-2">
                                    <div class="unit unit-spacing-md align-items-center flex-column flex-md-row text-center text-md-left">
                                        <div class="unit-left"><div class="info-classic-icon fa-phone"></div></div>
                                        <div class="unit-body"><a class="info-classic-link" href="tel:11945445680">(11) 94544-5680</a></div>
                                    </div>
                                </article>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!--Mailform-->
        <section class="section section-md">
            <div class="container">
                <h3>Feedback</h3>

                <div class="alert alert-success" th:if="${success != null and !success.isEmpty()}" th:text="${success}"></div>
                <div class="alert alert-danger" th:if="${error != null and !error.isEmpty()}" th:text="${error}"></div>

                <form th:action="@{/contato}" method="post" enctype="multipart/form-data">
                    <div class="row row-30">
                        <div class="col-md-4">
                            <div class="form-wrap">
                                <label class="form-label" for="contact-name">Nome:</label>
                                <input class="form-input" id="contact-name" type="text" name="name" required>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-wrap">
                                <label class="form-label" for="contact-phone">Telefone:</label>
                                <input class="form-input" id="contact-phone" type="text" name="phone">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-wrap">
                                <label class="form-label" for="contact-email">E-Mail:</label>
                                <input class="form-input" id="contact-email" type="email" name="email" required>
                            </div>
                        </div>
                        <div class="col-md-12">
                            <div class="form-wrap">
                                <label class="form-label" for="contact-message">Mensagem</label>
                                <textarea class="form-input" id="contact-message" name="message" required></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="form-button">
                        <button class="button button-primary" type="submit">Enviar</button>
                    </div>
                </form>
            </div>
        </section>
        <a class="section section-banner" href="" style="background-image: url(rs/images/banner/background-03-1920x310.jpg); background-image: -webkit-image-set( url(rs/images/banner/background-03-1920x310.jpg) 1x, url(rs/images/banner/background-03-3840x620.jpg) 2x )"></a>

        <div th:replace="~{fragments/intense :: footer}"></div>
    </div>
</body>
</html>
