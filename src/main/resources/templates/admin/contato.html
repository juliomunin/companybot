<!DOCTYPE html>
<html lang="pt-BR" data-x-mode="true" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/intense :: head}"></head>
<body>
    <div class="page">
        <header th:replace="~{fragments/intense :: navbar}"></header>

        <!--Mapa (exibido apenas quando MAPS_API_KEY está configurada)-->
        <section class="section" th:if="${mapsHabilitado}">
            <div id="mapa" class="mapa"></div>
            <script>
                function inicializarMapa() {
                    var coordenadas = {lat: -23.571449, lng: -46.586318};
                    var mapa = new google.maps.Map(document.getElementById('mapa'), {zoom: 15, center: coordenadas});
                    new google.maps.Marker({
                        position: coordenadas,
                        map: mapa,
                        title: 'CompanyBot - Rua São Nocásio, 211 - São Paulo/SP'
                    });
                }
            </script>
            <script async defer
                    th:src="@{https://maps.googleapis.com/maps/api/js(key=${mapsApiKey},callback=inicializarMapa)}"></script>
        </section>

        <!--Endereço (fallback sem chave do mapa)-->
        <section class="section" th:unless="${mapsHabilitado}">
            <div class="container">
                <div class="mapa-fallback">
                    <div>
                        <h3>Onde estamos</h3>
                        <p>Rua São Nocásio, 211 - São Paulo/SP</p>
                        <p class="text-muted">Agende uma visita pelo formulário abaixo.</p>
                    </div>
                </div>
            </div>
        </section>

        <!--Contatos-->
        <section class="section section-lg bg-gray-700">
            <div class="container">
                <div class="row row-30">
                    <div class="col-lg-4">
                        <div class="row row-30">
                            <div class="col-sm-6 col-lg-12 wow fadeInRight" data-wow-delay=".05s">
                                <article class="info-classic align-items-center">
                                    <div class="unit unit-spacing-md align-items-center flex-column flex-md-row text-center text-md-left">
                                        <div class="unit-left"><div class="info-classic-icon fa-envelope"></div></div>
                                        <div class="unit-body"><a class="info-classic-link" href="mailto:melianatosi@companybot.com.br">melianatosi@companybot.com.br</a></div>
                                    </div>
                                </article>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-4">
                        <div class="row row-30">
                            <div class="col-sm-6 col-lg-12 wow fadeInRight" data-wow-delay=".1s">
                                <article class="info-classic align-items-center info-classic-2">
                                    <div class="unit unit-spacing-md align-items-center flex-column flex-md-row text-center text-md-left">
                                        <div class="unit-left"><div class="info-classic-icon fa-phone"></div></div>
                                        <div class="unit-body"><a class="info-classic-link" href="tel:+5511945445680">(11) 94544-5680</a></div>
                                    </div>
                                </article>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!--Formulário-->
        <section class="section section-md">
            <div class="container">
                <h3>Feedback</h3>

                <div class="alert alert-success" role="status" th:if="${success != null and !success.isEmpty()}" th:text="${success}"></div>
                <div class="alert alert-danger" role="alert" th:if="${error != null and !error.isEmpty()}" th:text="${error}"></div>

                <form th:action="@{/contato}" method="post">
                    <div class="row row-30">
                        <div class="col-md-4">
                            <div class="form-wrap">
                                <label class="form-label" for="contact-name">Nome:</label>
                                <input class="form-input" id="contact-name" type="text" name="name" maxlength="120" autocomplete="name" required>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-wrap">
                                <label class="form-label" for="contact-phone">Telefone:</label>
                                <input class="form-input" id="contact-phone" type="tel" name="phone" maxlength="20" autocomplete="tel" inputmode="tel">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-wrap">
                                <label class="form-label" for="contact-email">E-Mail:</label>
                                <input class="form-input" id="contact-email" type="email" name="email" maxlength="160" autocomplete="email" required>
                            </div>
                        </div>
                        <div class="col-md-12">
                            <div class="form-wrap">
                                <label class="form-label" for="contact-message">Mensagem:</label>
                                <textarea class="form-input" id="contact-message" name="message" rows="6" maxlength="4000" required></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="form-button">
                        <button class="button button-primary" type="submit">Enviar</button>
                    </div>
                </form>
            </div>
        </section>

        <a class="section section-banner" th:href="@{/aulas}" aria-label="Conheça nossas aulas"></a>

        <div th:replace="~{fragments/intense :: footer}"></div>
    </div>
</body>
</html>
