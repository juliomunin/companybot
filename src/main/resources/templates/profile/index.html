<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/argon :: head}"></head>
<body>
    <nav th:replace="~{fragments/argon :: sidebar}"></nav>

    <div class="main-content">
        <nav th:replace="~{fragments/argon :: topbar}"></nav>

        <div class="header pb-8 pt-5 pt-lg-8 d-flex align-items-center"
             style="min-height: 600px; background-image: url(rs/images/theme/profile-cover.jpg); background-size: cover; background-position: center top;">
            <span class="mask bg-gradient-default opacity-8"></span>
            <div class="container-fluid align-items-center">
                <div class="row">
                    <div class="col-lg-7 col-md-10">
                        <h1 class="display-2 text-white">Olá <span th:text="${user.desnick}"></span></h1>
                        <p class="text-white mt-0 mb-5">Esta é a sua página de perfil.</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="container-fluid mt--7">
            <div class="row">
                <div class="col-xl-4 order-xl-2 mb-5 mb-xl-0">
                    <div class="card card-profile shadow">
                        <div class="row justify-content-center">
                            <div class="col-lg-3 order-lg-2">
                                <div class="card-profile-image">
                                    <a href="#">
                                        <img th:src="@{/rs/images/theme/team-4-800x800.jpg}" class="rounded-circle">
                                    </a>
                                </div>
                            </div>
                        </div>
                        <div class="card-header text-center border-0 pt-8 pt-md-4 pb-0 pb-md-4">
                            <div class="d-flex justify-content-between">
                                <a href="#" class="btn btn-sm btn-info mr-4">Conectar</a>
                                <a href="#" class="btn btn-sm btn-default float-right">Mensagem</a>
                            </div>
                        </div>
                        <div class="card-body pt-0">
                            <div class="row">
                                <div class="col">
                                    <div class="card-profile-stats d-flex justify-content-center">
                                        <div>
                                            <span class="heading">22</span>
                                            <span class="description">Friends</span>
                                        </div>
                                        <div>
                                            <span class="heading">10</span>
                                            <span class="description">Photos</span>
                                        </div>
                                        <div>
                                            <span class="heading">89</span>
                                            <span class="description">Comments</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="text-center">
                                <h5 class="h3" th:text="${user.desperson}"></h5>
                                <div class="h5 font-weight-300">
                                    <i class="ni location_pin mr-2"></i>São Paulo
                                </div>
                                <div class="h5 mt-4">
                                    <i class="ni business_briefcase-24 mr-2"></i>CompanyBot - Automação e Web Mining
                                </div>
                                <div>
                                    <i class="ni education_hat mr-2"></i>Completação em Sistemas para Internet
                                </div>
                                <hr class="my-4">
                                <p th:text="${user.deslogin}"></p>
                                <a href="#" class="btn btn-info">Follow</a>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-xl-8 order-xl-1">
                    <div class="card bg-secondary shadow">
                        <div class="card-header bg-white border-0">
                            <div class="row align-items-center">
                                <div class="col-8">
                                    <h3 class="mb-0">Meus Dados</h3>
                                </div>
                                <div class="col-4 text-right">
                                    <a th:href="@{/upload}" class="btn btn-sm btn-primary">Importar Arquivo</a>
                                </div>
                            </div>
                        </div>

                        <div class="card-body">
                            <div th:if="${success}" class="alert alert-success" role="alert">
                                <span class="alert-inner--text" th:text="${success}"></span>
                            </div>
                            <div th:if="${error}" class="alert alert-danger" role="alert">
                                <span class="alert-inner--text" th:text="${error}"></span>
                            </div>

                            <form th:action="@{/profile}" method="post">
                                <div class="pl-lg-4">
                                    <div class="row">
                                        <div class="col-lg-6">
                                            <div class="form-group">
                                                <label class="form-control-label" for="input-desperson">Nome</label>
                                                <input type="text" id="input-desperson" name="desperson" class="form-control form-control-alternative" th:value="${user.desperson}">
                                            </div>
                                        </div>
                                        <div class="col-lg-6">
                                            <div class="form-group">
                                                <label class="form-control-label" for="input-email">E-mail (login)</label>
                                                <input type="email" id="input-email" name="deslogin" class="form-control form-control-alternative" th:value="${user.deslogin}" disabled>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-6">
                                            <div class="form-group">
                                                <label class="form-control-label" for="input-nrddd">DDD</label>
                                                <input type="number" id="input-nrddd" name="nrddd" min="1" max="99" class="form-control form-control-alternative" th:value="${user.nrddd}" placeholder="Ex.: 11">
                                            </div>
                                        </div>
                                        <div class="col-lg-6">
                                            <div class="form-group">
                                                <label class="form-control-label" for="input-nrphone">Telefone</label>
                                                <input type="text" id="input-nrphone" name="nrphone" inputmode="numeric" class="form-control form-control-alternative" th:value="${user.nrphone}" placeholder="Ex.: 988887777">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-6">
                                            <div class="form-group">
                                                <label class="form-control-label" for="input-dtbirth">Data de nascimento</label>
                                                <input type="date" id="input-dtbirth" name="dtbirth" class="form-control form-control-alternative" th:value="${user.dtbirth != null ? #temporals.format(user.dtbirth,'yyyy-MM-dd') : ''}">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-12 text-right">
                                            <button type="submit" class="btn btn-primary">Salvar Alterações</button>
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:replace="~{fragments/argon :: footer}"></div>
    </div>
</body>
</html>
