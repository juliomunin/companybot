<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>CompanyBot</title>
    <link th:href="@{/rs/images/brand/favicon.png}" rel="icon" type="image/png">
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700" rel="stylesheet">
    <link th:href="@{/rs/js/plugins/nucleo/css/nucleo.css}" rel="stylesheet">
    <link th:href="@{/rs/js/plugins/@fortawesome/fontawesome-free/css/all.min.css}" rel="stylesheet">
    <link th:href="@{/rs/css/argon-dashboard.css?v=1.1.0}" rel="stylesheet">
</head>

<!-- Menu lateral (antiga views/profile/header.html) -->
<nav th:fragment="sidebar">
    <div class="navbar navbar-vertical fixed-left navbar-expand-md navbar-light bg-white" id="sidenav-main">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#sidenav-collapse-main" aria-controls="sidenav-main" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="sidenav-collapse-main">
                <div class="navbar-collapse-header d-md-none">
                    <div class="row">
                        <div class="col-6 collapse-close">
                            <button type="button" class="navbar-toggler" data-toggle="collapse" data-target="#sidenav-collapse-main" aria-controls="sidenav-main" aria-expanded="false" aria-label="Toggle sidenav"><span></span><span></span></button>
                        </div>
                    </div>
                </div>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/profile}"><i class="ni ni-tv-2 text-primary"></i> Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="#"><i class="ni ni-single-02 text-yellow"></i> Histórico</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/logout}"><i class="ni ni-key-25 text-info"></i> Logout</a>
                    </li>
                </ul>
                <hr class="my-3">
                <h6 class="navbar-heading text-muted">Atividades</h6>
                <ul class="navbar-nav mb-md-3">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/upload}"><i class="ni ni-spaceship"></i> Upload IPTU</a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</nav>

<!-- Barra superior -->
<nav th:fragment="topbar">
    <div class="navbar navbar-top navbar-expand-md navbar-dark" id="navbar-main">
        <div class="container-fluid">
            <a class="h4 mb-0 text-white text-uppercase d-none d-lg-inline-block" href="#">User Profile</a>
            <form class="navbar-search navbar-search-dark form-inline mr-3 d-none d-md-flex ml-lg-auto">
                <div class="form-group mb-0">
                    <div class="input-group input-group-alternative">
                        <div class="input-group-prepend"><span class="input-group-text"><i class="fas fa-search"></i></span></div>
                        <input class="form-control" placeholder="Search" type="text">
                    </div>
                </div>
            </form>
            <ul class="navbar-nav align-items-center d-none d-md-flex">
                <li class="nav-item dropdown">
                    <a class="nav-link pr-0" href="#" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                        <div class="media align-items-center">
                            <span class="avatar avatar-sm rounded-circle">
                                <img alt="Image placeholder" th:src="@{/rs/images/theme/team-1-800x800.jpg}">
                            </span>
                            <div class="media-body ml-2 d-none d-lg-block">
                                <span class="mb-0 text-sm font-weight-bold" th:text="${user != null ? user.desnick : ''}"></span>
                            </div>
                        </div>
                    </a>
                    <div class="dropdown-menu dropdown-menu-arrow dropdown-menu-right">
                        <div class="dropdown-header noti-title"><h6 class="text-overflow m-0">Bem Vindo!</h6></div>
                        <a href="#" class="dropdown-item"><i class="ni ni-single-02"></i><span>My profile</span></a>
                        <a href="#" class="dropdown-item"><i class="ni ni-settings-gear-65"></i><span>Settings</span></a>
                        <a href="#" class="dropdown-item"><i class="ni ni-calendar-grid-58"></i><span>Activity</span></a>
                        <a href="#" class="dropdown-item"><i class="ni ni-support-16"></i><span>Support</span></a>
                        <div class="dropdown-divider"></div>
                        <a th:href="@{/logout}" class="dropdown-item"><i class="ni ni-user-run"></i><span>Logout</span></a>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Rodapé + scripts (antiga views/profile/footer.html) -->
<div th:fragment="footer">
    <footer class="footer">
        <div class="row align-items-center justify-content-xl-between">
            <div class="col-xl-6">
                <div class="copyright text-center text-xl-left text-muted">
                    &copy; 2026 <a href="https://www.creative-tim.com" class="font-weight-bold ml-1" target="_blank">Creative Tim</a>
                </div>
            </div>
            <div class="col-xl-6">
                <ul class="nav nav-footer justify-content-center justify-content-xl-end">
                    <li class="nav-item"><a href="https://www.creative-tim.com" class="nav-link" target="_blank">Creative Tim</a></li>
                    <li class="nav-item"><a href="https://www.creative-tim.com/presentation" class="nav-link" target="_blank">About Us</a></li>
                    <li class="nav-item"><a href="https://github.com/creativetimofficial/argon-dashboard/blob/master/LICENSE.md" class="nav-link" target="_blank">MIT License</a></li>
                </ul>
            </div>
        </div>
    </footer>
    <script th:src="@{/rs/js/plugins/jquery/dist/core.js}"></script>
    <script th:src="@{/rs/js/argon-dashboard.js}"></script>
</div>

<!-- Scripts usados pelas páginas standalone (login/cadastrar/relembrar) -->
<div th:fragment="scripts">
    <script th:src="@{/rs/js/plugins/jquery/dist/core.js}"></script>
</div>
</html>
