# ============================================================
# Banco de dados (mesma base do projeto PHP: compan39_clientes)
# ============================================================
spring.datasource.url=jdbc:mysql://162.241.203.230:3306/compan39_clientes?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Fortaleza
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA/Hibernate (tabelas já existentes - não criar/alterar schema)
# ============================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ============================================================
# Thymeleaf
# ============================================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ============================================================
# E-mail (SMTP Gmail - mesmas credenciais do email.php)
# ============================================================
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=587
spring.mail.username=${SMTP_USER}
spring.mail.password=${SMTP_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Quem recebe os contatos do formulário (fallback do antigo addAddress)
app.mail.to=${MAIL_TO:juliomunin@companybot.com.br}
app.mail.from=noreply@gmail.com
app.mail.reply-to=melianatosi@companybot.com.br

# Custo do bcrypt (mesmo 'cost'=>12 do password_hash do PHP)
app.security.bcrypt-cost=12

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.port=${PORT:8080}

# ============================================================
# Concorrência (Java 21+) - virtual threads
# ============================================================
spring.threads.virtual.enabled=true

# ============================================================
# Aplicação
# ============================================================
spring.application.name=companybot

# ============================================================
# Observabilidade (Actuator + Micrometer/OpenTelemetry)
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.health.mail.enabled=false
management.info.env.enabled=true
management.metrics.tags.application=${spring.application.name}

# Tracing: habilita por env; endpoint OTLP configurável (ex.: collector/OTLP).
management.tracing.enabled=${TRACING_ENABLED:true}
management.tracing.sampling.probability=${TRACING_SAMPLE:1.0}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}