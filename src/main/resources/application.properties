# ============================================================
# Banco de dados (Kymus MySQL - definido por DB_URL/DB_USER/DB_PASS)
# ============================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA/Hibernate (tabelas já existentes - não criar/alterar schema)
# ============================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ============================================================
# Thymeleaf
# ============================================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# ============================================================
# E-mail (SMTP Gmail - mesmas credenciais do email.php)
# ============================================================
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=587
spring.mail.username=${SMTP_USER}
spring.mail.password=${SMTP_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Quem recebe os contatos do formulário (fallback do antigo addAddress)
app.mail.to=${MAIL_TO:juliomunin@companybot.com.br}
app.mail.from=${MAIL_FROM:noreply@gmail.com}
app.mail.reply-to=${MAIL_REPLY_TO:melianatosi@companybot.com.br}
# Apenas para desenvolvimento local: grava no log o link quando o envio falhar.
app.mail.log-links=${MAIL_LOG_LINKS:false}

# Dados do site usados em e-mails e metadados
app.site.name=${SITE_NAME:CompanyBot}
app.site.url=${SITE_URL:https://companybot.com.br}

# Chave do Google Maps (deixe vazia para esconder o mapa)
app.maps.api-key=${MAPS_API_KEY:}

# Acervo de aulas (JSON no classpath)
app.content.aulas=conteudo/aulas.json

# Custo do bcrypt (mesmo 'cost'=>12 do password_hash do PHP)
app.security.bcrypt-cost=12

# Redefinição de senha (token assinado, sem tabela extra)
# Em produção, defina RESET_SECRET com um valor longo e aleatório.
app.reset.secret=${RESET_SECRET:}
app.reset.expiration-minutes=${RESET_EXPIRATION_MINUTES:30}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.port=${PORT:8080}

# ============================================================
# Concorrência (Java 21+) - virtual threads
# ============================================================
spring.threads.virtual.enabled=true

# ============================================================
# Aplicação
# ============================================================
spring.application.name=companybot

# ============================================================
# Observabilidade (Actuator + Micrometer/OpenTelemetry)
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.health.mail.enabled=false
management.info.env.enabled=true
management.metrics.tags.application=${spring.application.name}

# Tracing (OTel/OTLP): desligado por padrão para não tentar exportar sem collector.
# Para ativar, defina TRACING_ENABLED=true e aponte OTEL_EXPORTER_OTLP_ENDPOINT para o collector.
management.tracing.enabled=${TRACING_ENABLED:false}
management.tracing.sampling.probability=${TRACING_SAMPLE:1.0}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}